

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SisVenda Pro - Vendas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #E3F2FD !important; }
    </style>
</head>
<body class="bg-[#E3F2FD] font-sans">
    <div class="bg-[#64B5F6] text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold"><a href="/">🛒 SISVENDA PRO</a></h1>
        <div class="space-x-4">
            <a href="/clientes" class="hover:underline">Clientes</a> 
            <a href="/produtos" class="hover:underline">Produtos</a> 
            <a href="/vendas" class="underline font-bold">Vendas</a> 
            <a href="/logout" class="bg-red-500 px-3 py-1 rounded-lg hover:bg-red-600">Sair</a>
        </div>
    </div>
    <div class="max-w-6xl mx-auto mt-8 px-4 flex flex-col md:flex-row gap-6">
        <div class="bg-white p-6 rounded-2xl shadow-md border border-blue-100 w-full md:w-1/3 h-fit">
            <h2 class="text-lg font-bold text-gray-700 mb-4">💰 REGISTRAR VENDA</h2>
            <form method="POST">
                <div class="mb-4">
                    <input type="text" name="cliente" placeholder="Nome do Cliente:" class="w-full p-3 bg-[#E3F2FD] border border-blue-200 rounded-xl focus:outline-none" required>
                </div>
                <div class="mb-4">
                    <input type="text" name="produto" placeholder="Nome do Produto:" class="w-full p-3 bg-[#E3F2FD] border border-blue-200 rounded-xl focus:outline-none" required>
                </div>
                <div class="mb-4">
                    <input type="text" name="total" placeholder="Valor Total (R$):" class="w-full p-3 bg-[#E3F2FD] border border-blue-200 rounded-xl focus:outline-none" required>
                </div>
                <button type="submit" class="w-full bg-[#2196F3] text-white p-3 rounded-xl font-bold hover:bg-blue-600 transition">💰 Concluir Venda</button>
            </form>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-md border border-blue-100 flex-1">
            <h2 class="text-lg font-bold text-gray-700 mb-4">HISTÓRICO DE VENDAS</h2>
            <div class="overflow-x-auto rounded-xl border border-blue-100">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-[#90CAF9] text-gray-700 font-bold">
                            <th class="p-3 text-center w-16">ID</th>
                            <th class="p-3">Cliente</th>
                            <th class="p-3">Produto</th>
                            <th class="p-3 text-center">Total</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-blue-50">
                        {% for venda in vendas %}
                        <tr class="hover:bg-blue-50/50">
                            <td class="p-3 text-center font-bold text-gray-500">{{ venda.id }}</td>
                            <td class="p-3 text-gray-700">{{ venda.cliente }}</td>
                            <td class="p-3 text-gray-700">{{ venda.produto }}</td>
                            <td class="p-3 text-center text-green-600 font-bold">R$ {{ "%.2f"|format(venda.total) }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
