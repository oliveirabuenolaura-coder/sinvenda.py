
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SisVenda Pro - Home</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #E3F2FD !important; }
    </style>
</head>
<body class="bg-[#E3F2FD] font-sans">
    <div class="bg-[#64B5F6] text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold">🛒 SISVENDA PRO</h1>
        <div class="space-x-4">
            <a href="/clientes" class="hover:underline">Clientes</a>
            <a href="/produtos" class="hover:underline">Produtos</a>
            <a href="/vendas" class="hover:underline">Vendas</a>
            <a href="/estoque" class="hover:underline">Estoque</a>
            <a href="/financeiro" class="hover:underline">Financeiro</a>
            <a href="/relatorio" class="hover:underline">Relatórios</a>
            <a href="/logout" class="bg-red-500 px-3 py-1 rounded-lg hover:bg-red-600">Sair</a>
        </div>
    </div>

    <div class="max-w-5xl mx-auto mt-10 p-6 bg-white rounded-2xl shadow-md border border-blue-100 text-center">
        <h2 class="text-3xl font-bold text-gray-700 mb-4">Bem-vindo ao SisVenda Pro</h2>
        <p class="text-gray-500 mb-6">Utilize os cartões abaixo para navegar pelas ferramentas do sistema.</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mt-6">
            <a href="/clientes" class="p-6 bg-blue-50 text-blue-600 rounded-xl font-bold hover:bg-blue-100 transition shadow-sm">👥 Clientes</a>
            <a href="/produtos" class="p-6 bg-green-50 text-green-600 rounded-xl font-bold hover:bg-green-100 transition shadow-sm">📦 Cadastrar Produtos</a>
            <a href="/vendas" class="p-6 bg-orange-50 text-orange-600 rounded-xl font-bold hover:bg-orange-100 transition shadow-sm">💰 Lançar Vendas</a>
            <a href="/estoque" class="p-6 bg-purple-50 text-purple-600 rounded-xl font-bold hover:bg-purple-100 transition shadow-sm">📋 Ver Estoque</a>
            <a href="/financeiro" class="p-6 bg-emerald-50 text-emerald-600 rounded-xl font-bold hover:bg-emerald-100 transition shadow-sm">💵 Fluxo Financeiro</a>
            <a href="/relatorio" class="p-6 bg-indigo-50 text-indigo-600 rounded-xl font-bold hover:bg-indigo-100 transition shadow-sm">📈 Relatório Geral</a>
        </div>
    </div>
</body>
</html>
