
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SisVenda Pro - Estoque</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#E3F2FD] font-sans">
    <div class="bg-[#64B5F6] text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold"><a href="/">🛒 SISVENDA PRO</a></h1>
        <div class="space-x-4"><a href="/clientes" class="hover:underline">Clientes</a> <a href="/produtos" class="hover:underline">Produtos</a> <a href="/vendas" class="hover:underline">Vendas</a> <a href="/logout" class="bg-red-500 px-3 py-1 rounded-lg hover:bg-red-600">Sair</a></div>
    </div>
    <div class="max-w-6xl mx-auto mt-8 px-4">
        <div class="bg-white p-6 rounded-2xl shadow-md border border-blue-100">
            <h2 class="text-xl font-bold text-gray-700 mb-6">📦 CONTROLE DE ESTOQUE</h2>
            <div class="overflow-x-auto rounded-xl border border-blue-100">
                <table class="w-full text-left border-collapse">
                    <thead><tr class="bg-[#90CAF9] text-gray-700 font-bold"><th class="p-3 text-center w-16">ID</th><th class="p-3">Nome do Produto</th><th class="p-3 text-center">Qtd Disponível</th><th class="p-3 text-center">Status</th></tr></thead>
                    <tbody class="divide-y divide-blue-50">
                        {% for produto in produtos %}
                        <tr class="hover:bg-blue-50/50">
                            <td class="p-3 text-center font-bold text-gray-500">{{ produto.id }}</td>
                            <td class="p-3 text-gray-700 font-semibold">{{ produto.nome }}</td>
                            <td class="p-3 text-center font-bold text-gray-700">{{ produto.estoque }}</td>
                            <td class="p-3 text-center">
                                {% if produto.estoque < 5 %}<span class="bg-red-100 text-red-600 text-xs px-2 py-1 rounded font-bold">⚠️ Baixo</span>
                                {% else %}<span class="bg-green-100 text-green-600 text-xs px-2 py-1 rounded font-bold">✅ Normal</span>{% endif %}
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
